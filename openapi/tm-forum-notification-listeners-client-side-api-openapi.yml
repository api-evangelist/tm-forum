components:
  schemas:
    Quantity:
      type: object
      description: An amount in a given unit
      properties:
        amount:
          default: 1
          type: number
          format: float
          description: Numeric value in a given unit
        units:
          type: string
          description: Unit
    ServiceSpecificationChangeEventPayload:
      type: object
      description: The event data structure
      properties:
        serviceSpecification:
          description: The involved resource data for the event
          $ref: '#/components/schemas/ServiceSpecification'
    TargetEntitySchema:
      type: object
      description: The reference object to the schema and type of target entity which is described by a specification
      required:
      - '@schemaLocation'
      - '@type'
      properties:
        '@schemaLocation':
          type: string
          description: This field provides a link to the schema describing the target entity
        '@type':
          type: string
          description: Class type of the target entity
    Error:
      description: Used when an API throws an Error, typically with a HTTP error response-code (3xx, 4xx, 5xx)
      type: object
      required:
      - code
      - reason
      properties:
        code:
          type: string
          description: Application relevant detail, defined in the API or a common list.
        reason:
          type: string
          description: Explanation of the reason for the error which can be shown to a client user.
        message:
          type: string
          description: More details and corrective actions related to the error which can be shown to a client user.
        status:
          type: string
          description: HTTP Error code extension
        referenceError:
          type: string
          format: uri
          description: URI of documentation describing the error.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name.
    ServiceCatalogChangeEventPayload:
      type: object
      description: The event data structure
      properties:
        serviceCatalog:
          description: The involved resource data for the event
          $ref: '#/components/schemas/ServiceCatalog'
    ServiceCandidateChangeEvent:
      type: object
      description: The notification data structure
      properties:
        event:
          description: The event payload linked to the involved resource object
          $ref: '#/components/schemas/ServiceCandidateChangeEventPayload'
