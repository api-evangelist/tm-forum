            description: Unique Identifier of the subAddress
          levelNumber:
            type: string
            description: used where a level type may be repeated e.g. BASEMENT 1, BASEMENT 2
          levelType:
            type: string
            description: describes level types within a building
          name:
            type: string
            description: Name of the subAddress to identify it with a meaningful identification
          privateStreetName:
            type: string
            description: private streets internal to a property (e.g. a university) may have internal names that are not recorded by the land title office.
          privateStreetNumber:
            type: string
            description: private streets numbers internal to a private street
          subUnit:
            type: array
            description: Representation of a SubUnit. It is used for describing subunit within a subAddress e.g. BERTH, FLAT, PIER, SUITE, SHOP, TOWER, UNIT, WHARF.
            items:
              $ref: '#/components/schemas/GeographicSubAddressUnit'
          subAddressType:
            type: string
            description: 'Type of subAddress : it can be a subunit or a private street'
      discriminator:
        propertyName: '@type'
        mapping:
          GeographicSubAddress: '#/components/schemas/GeographicSubAddress'
    PriceAlteration:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - type: object
        description: Is an amount, usually of money, that modifies the price charged for an order item.
        properties:
          applicationDuration:
            type: integer
            description: Duration during which the alteration applies on the order item price (for instance 2 months free of charge for the recurring charge)
          description:
            type: string
            description: A narrative that explains in detail the semantics of this order item price alteration
          name:
            type: string
            description: Name of the order item price alteration
          productOfferingPrice:
            $ref: '#/components/schemas/ProductOfferingPriceRef'
          priceType:
            type: string
            description: A category that describes the price such as recurring, one time and usage.
          priority:
            type: integer
            description: Priority level for applying this alteration among all the defined alterations on the order item price
          recurringChargePeriod:
            type: string
            description: Could be month, week...
          unitOfMeasure:
            type: string
            description: Could be minutes, GB...
          price:
            $ref: '#/components/schemas/Price'
      discriminator:
        propertyName: '@type'
        mapping:
          PriceAlteration: '#/components/schemas/PriceAlteration'
    GeographicSubAddressUnit_MVO:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - type: object
        description: Representation of a SubUnit. It is used for describing subunit within a subAddress e.g. BERTH, FLAT, PIER, SUITE, SHOP, TOWER, UNIT, WHARF.
        properties:
          subUnitNumber:
            type: string
            description: The discriminator used for the subunit, often just a simple number but may also be a range.
          subUnitType:
            type: string
            description: The type of subunit e.g.BERTH, FLAT, PIER, SUITE, SHOP, TOWER, UNIT, WHARF, RACK
      discriminator:
        propertyName: '@type'
        mapping:
          GeographicSubAddressUnit: '#/components/schemas/GeographicSubAddressUnit_MVO'
    Addressable_FVO:
      type: object
      description: Base schema for adressable entities
      properties:
        id:
          type: string
          description: unique identifier
    QuoteItemRef_FVO:
      allOf:
      - $ref: '#/components/schemas/Extensible_FVO'
      - type: object
        description: A reference to Quote item that has been executed previously.
        properties:
          quoteHref:
            type: string
            description: Reference of the related quote.
          '@referredType':
            type: string
            description: The actual type of the target instance when needed for disambiguation.
          quoteId:
            type: string
            description: Unique identifier of a refered quote.
          quoteItemId:
            type: string
            description: 'Identifier of a quote item. '
        required:
        - quoteId
        - quoteItemId
      discriminator:
        propertyName: '@type'
        mapping:
          QuoteItemRef: '#/components/schemas/QuoteItemRef_FVO'
    GeographicSubAddressUnit:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - type: object
        description: Representation of a SubUnit. It is used for describing subunit within a subAddress e.g. BERTH, FLAT, PIER, SUITE, SHOP, TOWER, UNIT, WHARF.
        properties:
          subUnitNumber:
            type: string
            description: The discriminator used for the subunit, often just a simple number but may also be a range.
          subUnitType:
            type: string
            description: The type of subunit e.g.BERTH, FLAT, PIER, SUITE, SHOP, TOWER, UNIT, WHARF, RACK
      discriminator:
        propertyName: '@type'
        mapping:
          GeographicSubAddressUnit: '#/components/schemas/GeographicSubAddressUnit'
    OrderPrice_FVO:
      allOf:
      - $ref: '#/components/schemas/Extensible_FVO'
      - type: object
        description: An amount, usually of money, that represents the actual price paid by the Customer for this item or this order
        properties:
          description:
            type: string
            description: A narrative that explains in detail the semantics of this order item price.
          name:
            type: string
            description: A short descriptive name such as "Subscription price".
          productOfferingPrice:
            $ref: '#/components/schemas/ProductOfferingPriceRef_FVO'
          recurringChargePeriod:
            type: string
            description: Could be month, week...
          unitOfMeasure:
            type: string
            description: Could be minutes, GB...
          billingAccount:
            $ref: '#/components/schemas/BillingAccountRef_FVO'
          priceAlteration:
            type: array
            description: a strucuture used to describe a price alteration
            items:
              $ref: '#/components/schemas/PriceAlteration_FVO'
          price:
            $ref: '#/components/schemas/Price_FVO'
          priceType:
            type: string
            description: indicate if the price is for recurrent or no-recurrent charge
        required:
        - priceType
        - price
      discriminator:
        propertyName: '@type'
        mapping:
          OrderPrice: '#/components/schemas/OrderPrice_FVO'
    ExternalIdentifier_FVO:
      allOf:
      - $ref: '#/components/schemas/Extensible_FVO'
      - type: object
        description: An identification of an entity that is owned by or originates in a software system different from the current system, for example a ProductOrder handed off from a commerce platform into an order handling system. The structure identifies the system itself, the nature of the entity within the system (e.g. class name) and the unique ID of the entity within the system. It is anticipated that multiple external IDs can be held for a single entity, e.g. if the entity passed through multiple systems on the way to the current system. In this case the consumer is expected to sequence the IDs in the array in reverse order of provenance, i.e. most recent system first in the list.
        properties:
          owner:
            type: string
            description: Name of the external system that owns the entity.
            example: MagentoCommerce
          externalIdentifierType:
            type: string
            description: Type of the identification, typically would be the type of the entity within the external system
            example: ProductOrder
          id:
            type: string
            description: identification of the entity within the external system.
        required:
        - id
      discriminator:
        propertyName: '@type'
        mapping:
          ExternalIdentifier: '#/components/schemas/ExternalIdentifier_FVO'
    AgreementRef_MVO:
      type: object
      description: Agreement reference. An agreement represents a contract or arrangement, either written or verbal and sometimes enforceable by law, such as a service level agreement or a customer price agreement. An agreement involves a number of other business entities, such as products, services, and resources and/or their specifications.
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          AgreementRef: '#/components/schemas/AgreementRef_MVO'
