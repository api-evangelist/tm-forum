openapi: 3.0.1
info:
  title: Product Catalog Management agreement resourceCatalog API
  description: "Product Catalog API is one of Catalog Management API Family. Product Catalog API goal is to provide a catalog of products. \n### Operations\nProduct Catalog API performs the following operations on the resources :\n- Retrieve an entity or a collection of entities depending on filter criteria\n- Partial update of an entity (including updating rules)\n- Create an entity (including default values and creation rules)\n- Delete an entity\n- Manage notification of events"
  version: 5.0.0
servers:
- url: https://serverRoot/productCatalogManagement/v5/
tags:
- name: resourceCatalog
paths:
  /resourceCatalog:
    get:
      operationId: listResourceCatalog
      summary: List or find ResourceCatalog objects
      description: This operation list or find ResourceCatalog entities
      tags:
      - resourceCatalog
      parameters:
      - name: fields
        description: Comma-separated properties to be provided in response
        required: false
        in: query
        type: string
      - name: offset
        description: Requested index for start of resources to be provided in response
        required: false
        in: query
        type: integer
      - name: limit
        description: Requested number of resources to be provided in response
        required: false
        in: query
        type: integer
      responses:
        '200':
          description: Success
          headers:
            X-Result-Count:
              description: Actual number of items returned in the response body
              type: integer
            X-Total-Count:
              description: Total number of items matching criteria
              type: integer
          schema:
            type: array
            items:
              $ref: '#/definitions/ResourceCatalog'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        '405':
          description: Method Not allowed
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Conflict
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
    post:
      operationId: createResourceCatalog
      summary: Creates a ResourceCatalog
      description: This operation creates a ResourceCatalog entity.
      tags:
      - resourceCatalog
      parameters:
      - name: resourceCatalog
        description: The ResourceCatalog to be created
        required: true
        schema:
          $ref: '#/definitions/ResourceCatalog_Create'
        in: body
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/ResourceCatalog'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        '405':
          description: Method Not allowed
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Conflict
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
  /resourceCatalog/{id}:
    get:
      operationId: retrieveResourceCatalog
      summary: Retrieves a ResourceCatalog by ID
      description: This operation retrieves a ResourceCatalog entity. Attribute selection is enabled for all first level attributes.
      tags:
      - resourceCatalog
      parameters:
      - name: id
        description: Identifier of the ResourceCatalog
        required: true
        type: string
        in: path
      - name: fields
        description: Comma-separated properties to provide in response
        required: false
        type: string
        in: query
      responses:
        '200':
          description: Success
          schema:
