        description: Date and time of the last update
      lifecycleStatus:
        type: string
        description: Used to indicate the current lifecycle status
      name:
        type: string
        description: Name of the service catalog
      version:
        type: string
        description: ServiceCatalog version
      category:
        type: array
        items:
